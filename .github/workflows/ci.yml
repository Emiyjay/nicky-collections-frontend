name: Frontend CI

on:
  push:
    branches: ['main', 'feat/**']
  pull_request:
    branches: ['main']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api
          NEXT_PUBLIC_SITE_URL: https://nickycollections.com
          NEXT_PUBLIC_WHATSAPP_NUMBER: 13502208962
          NEXT_PUBLIC_PHONE_NUMBER: 13502208962
          NEXT_PUBLIC_DISPLAY_PHONE_NUMBER: '+1 (350) 220-8962'
